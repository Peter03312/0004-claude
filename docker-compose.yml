services:
  web:
    build: .
    # 宿主端口由环境变量 WEB_PORT 覆盖，缺省 8080
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收服务：跑完测试即退出，退出码即验收结果
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web
